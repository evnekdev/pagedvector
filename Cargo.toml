[package]
description = "A sparse paged vector with lazy page allocation."
license = "MIT"
repository = "https://github.com/evnekdev/pagedvector"
name = "pagedvector"
version = "0.1.0"
edition = "2021"
readme = "README.md"
keywords = ["vector", "sparse", "paged", "storage"]
categories = ["data-structures"]

[dependencies]
serde = {version = "1.0", features = ["derive", "rc"]}
bincode = {version = "2.0", features=["serde","alloc"]}